apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: lab
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - hello.aiworkery.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: hello
          port: 80
