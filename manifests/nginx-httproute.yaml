apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: lab
spec:
  parentRefs:
    - name: traefik-gateway      # use the name from `kubectl get gateway -A`
      namespace: traefik
  hostnames:
    - demo.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: nginx
          port: 80
