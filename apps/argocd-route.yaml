apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-route
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/taitran2008/lab-gitops.git
    targetRevision: HEAD
    path: argocd-route
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
