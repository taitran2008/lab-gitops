apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - argocd.aiworkery.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        # argocd-server runs with server.insecure=true, so port 80 is plain
        # HTTP. TLS is terminated at the Cloudflare edge.
        - name: argocd-server
          port: 80
