apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.3.3         # pin explicitly; check current with: helm search repo argo/argo-cd --versions
    helm:
      releaseName: argocd
      values: |
        global:
          revisionHistoryLimit: 1
        configs:
          cm:
            # Public URL, used for generated links and SSO redirects.
            # The route itself lives in argocd-route/, not here.
            url: https://argocd.aiworkery.com
          params:
            server.insecure: true
            log.level: debug
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
