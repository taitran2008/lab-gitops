apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 9.3.5          # pin explicitly; check current with helm search
    helm:
      releaseName: argocd
      values: |
        global:
          revisionHistoryLimit: 1
        configs:
          params:
            server.insecure: true
            log.level: debug
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
